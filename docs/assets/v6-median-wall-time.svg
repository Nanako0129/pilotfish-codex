<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Median wall time per candidate</title>
  <desc id="desc">Luna took 28.55 seconds, Terra took 41.09 seconds, and Sol took 40.76 seconds in median wall time across twelve trials each.</desc>
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #d7dde5; stroke-width: 1; }
    .axis { stroke: #7b8794; stroke-width: 1.25; }
    .title { fill: #111827; font: 700 29px ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.5px; }
    .subtitle { fill: #5f6b7a; font: 400 15px ui-sans-serif, system-ui, sans-serif; }
    .tick { fill: #697586; font: 400 13px ui-sans-serif, system-ui, sans-serif; }
    .name { fill: #1f2937; font: 600 16px ui-sans-serif, system-ui, sans-serif; }
    .value { fill: #111827; font: 700 18px ui-sans-serif, system-ui, sans-serif; }
    .note { fill: #697586; font: 400 12px ui-sans-serif, system-ui, sans-serif; }
  </style>
  <rect class="bg" width="960" height="420" />
  <text x="72" y="58" class="title">Median wall time</text>
  <text x="72" y="84" class="subtitle">Across 12 trials per candidate · lower is faster</text>
  <line x1="210" y1="136" x2="840" y2="136" class="axis" />
  <line x1="210" y1="198" x2="840" y2="198" class="grid" />
  <line x1="210" y1="260" x2="840" y2="260" class="grid" />
  <line x1="210" y1="322" x2="840" y2="322" class="grid" />
  <text x="210" y="118" text-anchor="middle" class="tick">25s</text>
  <text x="367" y="118" text-anchor="middle" class="tick">30s</text>
  <text x="525" y="118" text-anchor="middle" class="tick">35s</text>
  <text x="682" y="118" text-anchor="middle" class="tick">40s</text>
  <text x="840" y="118" text-anchor="middle" class="tick">45s</text>
  <text x="92" y="182" class="name">Luna</text>
  <line x1="210" y1="176" x2="840" y2="176" class="grid" />
  <circle cx="322" cy="176" r="10" fill="#0f8f9b" />
  <text x="342" y="182" class="value">28.55s</text>
  <text x="92" y="244" class="name">Terra</text>
  <line x1="210" y1="238" x2="840" y2="238" class="grid" />
  <circle cx="716" cy="238" r="10" fill="#a8b1bd" />
  <text x="736" y="244" class="value">41.09s</text>
  <text x="92" y="306" class="name">Sol</text>
  <line x1="210" y1="300" x2="840" y2="300" class="grid" />
  <circle cx="706" cy="300" r="10" fill="#4d5e73" />
  <text x="726" y="306" class="value">40.76s</text>
  <text x="72" y="382" class="note">Native rollout proxy · cohort live-20260803-v6</text>
</svg>

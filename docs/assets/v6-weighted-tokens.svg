<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Weighted token usage per 12-trial cohort</title>
  <desc id="desc">Luna used 697 thousand weighted tokens, Terra used 654 thousand, and Sol used 761 thousand across twelve trials each.</desc>
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #d7dde5; stroke-width: 1; }
    .axis { stroke: #7b8794; stroke-width: 1.25; }
    .title { fill: #111827; font: 700 29px ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.5px; }
    .subtitle { fill: #5f6b7a; font: 400 15px ui-sans-serif, system-ui, sans-serif; }
    .tick { fill: #697586; font: 400 13px ui-sans-serif, system-ui, sans-serif; }
    .name { fill: #1f2937; font: 600 16px ui-sans-serif, system-ui, sans-serif; }
    .value { fill: #111827; font: 700 18px ui-sans-serif, system-ui, sans-serif; }
    .note { fill: #697586; font: 400 12px ui-sans-serif, system-ui, sans-serif; }
  </style>
  <rect class="bg" width="960" height="480" />
  <text x="72" y="58" class="title">Weighted token usage</text>
  <text x="72" y="84" class="subtitle">Per 12-trial cohort · lower is better when quality is comparable</text>
  <line x1="112" y1="390" x2="900" y2="390" class="axis" />
  <line x1="112" y1="322" x2="900" y2="322" class="grid" />
  <line x1="112" y1="254" x2="900" y2="254" class="grid" />
  <line x1="112" y1="186" x2="900" y2="186" class="grid" />
  <line x1="112" y1="118" x2="900" y2="118" class="grid" />
  <text x="96" y="394" text-anchor="end" class="tick">0</text>
  <text x="96" y="326" text-anchor="end" class="tick">200k</text>
  <text x="96" y="258" text-anchor="end" class="tick">400k</text>
  <text x="96" y="190" text-anchor="end" class="tick">600k</text>
  <text x="96" y="122" text-anchor="end" class="tick">800k</text>
  <rect x="214" y="153" width="132" height="237" fill="#0f8f9b" />
  <text x="280" y="137" text-anchor="middle" class="value">697k</text>
  <text x="280" y="424" text-anchor="middle" class="name">Luna</text>
  <rect x="414" y="168" width="132" height="222" fill="#a8b1bd" />
  <text x="480" y="152" text-anchor="middle" class="value">654k</text>
  <text x="480" y="424" text-anchor="middle" class="name">Terra</text>
  <rect x="614" y="131" width="132" height="259" fill="#4d5e73" />
  <text x="680" y="115" text-anchor="middle" class="value">761k</text>
  <text x="680" y="424" text-anchor="middle" class="name">Sol</text>
  <text x="112" y="458" class="note">Native rollout proxy · cohort live-20260803-v6</text>
</svg>
